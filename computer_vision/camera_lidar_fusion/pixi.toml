[workspace]
channels = ["robostack-jazzy", "conda-forge"]
name = "camera-lidar-fusion"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
kitti-to-bag = { cmd = "python tools/kitti_to_bag.py", description = "Convert KITTI tracking sequences to rosbag2: pixi run kitti-to-bag 0000 0001" }
test-tools = { cmd = "python -m pytest tests -q", description = "Python tests for tools/" }
play = { cmd = "ros2 bag play", description = "Play a bag: pixi run play bags/kitti_0000" }
rviz = { cmd = "rviz2 -d src/kitti_bringup/rviz/kitti.rviz", description = "RViz2 with image, cloud, TF and GT boxes" }
# --base-paths src keeps colcon from crawling .pixi/, which holds hundreds of ROS package.xml files.
# CMAKE_EXPORT_COMPILE_COMMANDS goes through the environment so packages with
# nothing to compile (kitti_bringup) don't warn about an unused -D.
# console_cohesion+ prints each package's full output when it finishes; Ninja
# writes compiler errors and warnings to stdout, which colcon hides by default.
build = { cmd = "colcon build --base-paths src --symlink-install --event-handlers console_cohesion+ --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=Release && python tools/merge_compile_commands.py", env = { CMAKE_EXPORT_COMPILE_COMMANDS = "ON" }, description = "Build the ROS 2 packages in src/ (colcon, Ninja, Release) and merge build/compile_commands.json" }
test = { cmd = "colcon test --base-paths src && colcon test-result --verbose", depends-on = ["build"], description = "Build, then run the C++ tests (gtest via colcon); fails if any test fails" }
format = { cmd = "find src -name '*.[ch]pp' -exec clang-format -i {} +", description = "Format every C++ file in src/ with clang-format (style in .clang-format)" }
ws = { cmd = "bash tools/ws_run.sh", description = "Run a command with install/ sourced: pixi run ws ros2 launch kitti_bringup kitti.launch.py bag:=bags/kitti_0000" }

[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-vision-msgs = ">=4.1.1,<5"
ros-jazzy-vision-msgs-rviz-plugins = ">=4.1.1,<5"
ros-jazzy-cv-bridge = ">=4.1.0,<5"
ros-jazzy-message-filters = ">=4.11.17,<5"
ros-jazzy-image-transport = ">=5.1.8,<6"
ros-jazzy-tf2-ros = ">=0.36.22,<0.37"
ros-jazzy-tf2-eigen = ">=0.36.22,<0.37"
ros-jazzy-rosbag2 = ">=0.26.11,<0.27"
ros-jazzy-ament-cmake-gtest = ">=2.5.6,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=2.0.0,<3"
cmake = ">=4.4.5,<5"
pkg-config = ">=0.29.2,<0.30"
ninja = ">=1.13.2,<2"
eigen = ">=5.0.1,<6"
onnxruntime-cpp = ">=1.31.0,<2"
rosbags = ">=0.11.9,<0.12"
numpy = ">=2.5.4,<3"
pytest = ">=8,<9"
opencv = ">=4.13.0,<5"
clang-format = ">=23.1.4,<24"

# YOLO -> ONNX export. A separate environment with no ROS, so PyTorch never
# enters the default environment that builds and runs the nodes. CI never
# installs it, so it is only solved for macOS.
[feature.export]
platforms = ["osx-arm64"]

[feature.export.dependencies]
ultralytics = ">=8.4.192,<9"
pytorch = ">=2.14.1,<3"
onnx = ">=1.23.2,<2"
onnxslim = ">=0.1.98,<0.2"
onnxruntime = ">=1.31.1,<2"
torchvision = ">=0.29.2,<0.30"

[feature.export.activation.env]
# No usage analytics or update checks, and keep Ultralytics' settings file
# inside the project instead of ~/Library/Application Support.
YOLO_OFFLINE = "true"
YOLO_CONFIG_DIR = "$PIXI_PROJECT_ROOT/.pixi/ultralytics"

[feature.export.tasks]
export-yolo = { cmd = "python tools/export_yolo.py", description = "Export YOLO11n to models/yolo11n_384x1280.onnx (downloads yolo11n.pt on first run)" }
yolo-reference = { cmd = "python tools/yolo_reference.py", description = "Run Ultralytics predict on KITTI frames and write the detector_cpp reference fixtures" }

[environments]
export = { features = ["export"], no-default-feature = true }
