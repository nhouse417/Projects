[workspace]
channels = ["robostack-jazzy", "conda-forge"]
name = "camera-lidar-fusion"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
kitti-to-bag = { cmd = "python tools/kitti_to_bag.py", description = "Convert KITTI tracking sequences to rosbag2: pixi run kitti-to-bag 0000 0001" }
test-tools = { cmd = "python -m pytest tests -q", description = "Python tests for tools/" }
play = { cmd = "ros2 bag play", description = "Play a bag: pixi run play bags/kitti_0000" }
rviz = { cmd = "rviz2 -d src/kitti_bringup/rviz/kitti.rviz", description = "RViz2 with image, cloud, TF and GT boxes" }

[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-vision-msgs = ">=4.1.1,<5"
ros-jazzy-vision-msgs-rviz-plugins = ">=4.1.1,<5"
ros-jazzy-cv-bridge = ">=4.1.0,<5"
ros-jazzy-message-filters = ">=4.11.17,<5"
ros-jazzy-image-transport = ">=5.1.8,<6"
ros-jazzy-tf2-ros = ">=0.36.22,<0.37"
ros-jazzy-tf2-eigen = ">=0.36.22,<0.37"
ros-jazzy-rosbag2 = ">=0.26.11,<0.27"
ros-jazzy-ament-cmake-gtest = ">=2.5.6,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
compilers = ">=2.0.0,<3"
cmake = ">=4.4.5,<5"
pkg-config = ">=0.29.2,<0.30"
ninja = ">=1.13.2,<2"
eigen = ">=5.0.1,<6"
onnxruntime-cpp = ">=1.31.0,<2"
rosbags = ">=0.11.9,<0.12"
numpy = ">=2.5.4,<3"
pytest = ">=8,<9"
opencv = ">=4.13.0,<5"
